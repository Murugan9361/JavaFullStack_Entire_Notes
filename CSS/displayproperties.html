<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Properties</title>
    <style>
        h1 {
            display: inline;
        }
        h2 {
            display: inline;
        }
        span {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Krishna Prakash</h1>
    <h2>P</h2>
    <span>Welcome to Krishna Birthday</span>
    <span>Have a nice day</span>
</body>
</html>
